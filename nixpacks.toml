[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.build]
cmds = [
  "npm install --prefix client --include=dev",
  "npm run build --prefix client",
  "npm install --prefix server --omit=dev",
  "pip3 install -r python-service/requirements.txt"
]

[start]
cmd = "bash start.sh"
