[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.build]
cmds = [
  "npm install --prefix client --include=dev",
  "npm run build --prefix client",
  "npm install --prefix server --omit=dev",
  "python3 -m pip install --break-system-packages -r python-service/requirements.txt"
]

[start]
cmd = "bash start.sh"
